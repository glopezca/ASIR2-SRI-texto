name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate material
        run: python3 tests/validate_material.py
